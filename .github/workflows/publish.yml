# Publishes allisall to PyPI when a version tag is pushed, through trusted
# publishing.
#
# Tags are pushed by the release automation only, and every publish waits
# for approval on the pypi environment. The build and the upload are
# separate jobs, so the job that may request an identity token runs nothing
# but the upload.

name: Publish

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: The tag is the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^__version__ = "\([^"]*\)".*/\1/p' src/allisall/_version.py)
          if [ -z "$version" ] || [ "${TAG#v}" != "$version" ]; then
            echo "::error::tag $TAG does not match src/allisall/_version.py version '$version'"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.7"
      - run: uv build
      - name: The build carries the tag's version
        run: |
          set -euo pipefail
          ls dist
          test -f "dist/allisall-$VERSION.tar.gz"
          ls "dist/allisall-$VERSION-"*.whl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3, release/v1
        with:
          skip-existing: true
